name: Email Dispatcher Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-dispatcher-cron
  cancel-in-progress: false

jobs:
  dispatch:
    name: Process email outbox
    runs-on: ubuntu-latest
    steps:
      - name: Invoke email dispatcher
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --request POST \
            'https://bhagksfvszeogtjvjtpx.supabase.co/functions/v1/email-dispatcher?limit=20'
