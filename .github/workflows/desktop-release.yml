name: Desktop Release

# macOS hard gate (stable only):
# Required secrets (repository/environment secrets):
# - APPLE_SIGNING_CERT_BASE64: certificado Developer ID Application em base64 (.p12)
# - APPLE_SIGNING_CERT_PASSWORD: senha do .p12
# - APPLE_ID: Apple ID com permissao de notarizacao
# - APPLE_APP_SPECIFIC_PASSWORD: app-specific password do Apple ID
# - APPLE_TEAM_ID: Team ID da conta Apple Developer
# Post-build verification commands (executados no job mac):
# - codesign --verify --deep --strict --verbose=2 <app>.app
# - spctl --assess --type execute --verbose=4 <app>.app
# - xcrun stapler validate <app>.app
# - xcrun stapler staple <arquivo>.dmg
# - xcrun stapler validate <arquivo>.dmg
# - spctl --assess --type open --context context:primary-signature --verbose=4 <arquivo>.dmg

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target_name: macos
            npm_script: desktop:pack:mac
            artifact_name: desktop-macos
            artifact_paths: |
              app/desktop/artifacts/*.dmg
              app/desktop/artifacts/*-mac.zip
              app/desktop/artifacts/stable-mac.yml
          - os: windows-latest
            target_name: windows
            npm_script: desktop:pack:win
            artifact_name: desktop-windows
            artifact_paths: |
              app/desktop/artifacts/*Setup*.exe
              app/desktop/artifacts/stable.yml
          - os: ubuntu-latest
            target_name: linux
            npm_script: desktop:pack:linux
            artifact_name: desktop-linux
            artifact_paths: |
              app/desktop/artifacts/*.AppImage
              app/desktop/artifacts/*_amd64.deb
              app/desktop/artifacts/stable-linux.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Sync app version from tag
        working-directory: app
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            echo "Tag invalida para versionamento desktop: $RELEASE_TAG"
            exit 1
          fi

          app_version="${BASH_REMATCH[1]}"
          npm pkg set version="$app_version"
          echo "Desktop version sincronizada para $app_version (tag: $RELEASE_TAG)"
          node -p "require('./package.json').version"

      - name: Build web app
        working-directory: app
        run: npm run build:desktop:web

      - name: Validate mac signing secrets
        if: matrix.target_name == 'macos'
        shell: bash
        env:
          APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for secret_name in \
            APPLE_SIGNING_CERT_BASE64 \
            APPLE_SIGNING_CERT_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required mac signing/notarization secrets: ${missing[*]}"
            exit 1
          fi

          cert_file="$(mktemp "${RUNNER_TEMP}/apple-signing-XXXXXX.p12")"
          cert_info_file="$(mktemp "${RUNNER_TEMP}/apple-signing-info-XXXXXX.txt")"
          temp_keychain="${RUNNER_TEMP}/apple-signing-$(uuidgen).keychain-db"
          temp_keychain_password="$(uuidgen)"
          trap 'security delete-keychain "$temp_keychain" >/dev/null 2>&1 || true; rm -f "$cert_file" "$cert_info_file"' EXIT

          # macOS runner can expose BSD base64; support both GNU and BSD flags.
          if ! printf '%s' "$APPLE_SIGNING_CERT_BASE64" | base64 --decode > "$cert_file" 2>/dev/null; then
            if ! printf '%s' "$APPLE_SIGNING_CERT_BASE64" | base64 -D > "$cert_file" 2>/dev/null; then
              echo "APPLE_SIGNING_CERT_BASE64 is not valid base64"
              exit 1
            fi
          fi

          security create-keychain -p "$temp_keychain_password" "$temp_keychain" >/dev/null
          security unlock-keychain -p "$temp_keychain_password" "$temp_keychain" >/dev/null
          security set-keychain-settings -lut 21600 "$temp_keychain" >/dev/null

          if ! security import "$cert_file" -k "$temp_keychain" -P "$APPLE_SIGNING_CERT_PASSWORD" -f pkcs12 -A >/dev/null 2>&1; then
            echo "APPLE_SIGNING_CERT_PASSWORD cannot open APPLE_SIGNING_CERT_BASE64 (.p12)"
            exit 1
          fi

          if ! security find-identity -v -p codesigning "$temp_keychain" > "$cert_info_file" 2>&1; then
            echo "Could not inspect the imported signing identity"
            exit 1
          fi

          if ! grep -q "Developer ID Application" "$cert_info_file"; then
            echo "The provided certificate is not a Developer ID Application certificate"
            exit 1
          fi

          if ! xcrun notarytool store-credentials "ci-notary-preflight" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --validate > /dev/null; then
            echo "APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID failed notarytool validation"
            exit 1
          fi

          echo "mac signing/notarization secrets validated (presence + p12 + notary auth)"

      - name: Build desktop artifacts (mac signed + notarized)
        if: matrix.target_name == 'macos'
        working-directory: app
        env:
          CSC_LINK: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.npm_script }}

      - name: Verify mac signature and notarization
        if: matrix.target_name == 'macos'
        working-directory: app
        shell: bash
        env:
          APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          cert_file="$(mktemp "${RUNNER_TEMP}/apple-signing-verify-XXXXXX.p12")"
          temp_keychain="${RUNNER_TEMP}/apple-signing-verify-$(uuidgen).keychain-db"
          temp_keychain_password="$(uuidgen)"
          trap 'security delete-keychain "$temp_keychain" >/dev/null 2>&1 || true; rm -f "$cert_file"' EXIT

          # macOS runner can expose BSD base64; support both GNU and BSD flags.
          if ! printf '%s' "$APPLE_SIGNING_CERT_BASE64" | base64 --decode > "$cert_file" 2>/dev/null; then
            if ! printf '%s' "$APPLE_SIGNING_CERT_BASE64" | base64 -D > "$cert_file" 2>/dev/null; then
              echo "APPLE_SIGNING_CERT_BASE64 is not valid base64"
              exit 1
            fi
          fi

          security create-keychain -p "$temp_keychain_password" "$temp_keychain" >/dev/null
          security unlock-keychain -p "$temp_keychain_password" "$temp_keychain" >/dev/null
          security set-keychain-settings -lut 21600 "$temp_keychain" >/dev/null
          security list-keychains -d user -s "$temp_keychain" >/dev/null
          security default-keychain -d user -s "$temp_keychain" >/dev/null

          if ! security import "$cert_file" -k "$temp_keychain" -P "$APPLE_SIGNING_CERT_PASSWORD" -f pkcs12 -A >/dev/null 2>&1; then
            echo "APPLE_SIGNING_CERT_PASSWORD cannot open APPLE_SIGNING_CERT_BASE64 (.p12)"
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$temp_keychain_password" "$temp_keychain" >/dev/null

          dmg_signing_identity="$(security find-identity -v -p codesigning "$temp_keychain" | awk '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$dmg_signing_identity" ]; then
            echo "Developer ID Application identity not found in temporary keychain for DMG signing"
            exit 1
          fi

          app_bundles=()
          while IFS= read -r -d '' app_bundle; do
            app_bundles+=("$app_bundle")
          done < <(find desktop/artifacts -maxdepth 2 -type d -name '*.app' -print0 | sort -z)

          dmg_files=()
          while IFS= read -r -d '' dmg_file; do
            dmg_files+=("$dmg_file")
          done < <(find desktop/artifacts -maxdepth 1 -type f -name '*.dmg' -print0 | sort -z)

          if [ ${#app_bundles[@]} -lt 2 ]; then
            echo "Expected both macOS app bundles (x64 and arm64), found ${#app_bundles[@]}"
            exit 1
          fi

          if [ ${#dmg_files[@]} -lt 2 ]; then
            echo "Expected both macOS dmg files (x64 and arm64), found ${#dmg_files[@]}"
            exit 1
          fi

          for app_bundle in "${app_bundles[@]}"; do
            echo "Verifying codesign and notarization for $app_bundle"
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            spctl --assess --type execute --verbose=4 "$app_bundle"
            xcrun stapler validate "$app_bundle"
          done

          for dmg in "${dmg_files[@]}"; do
            echo "Verifying signature and notarization for $dmg"
            codesign --force --sign "$dmg_signing_identity" --timestamp --keychain "$temp_keychain" "$dmg"
            codesign --verify --verbose=2 "$dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          done

      - name: Build desktop artifacts (non-mac)
        if: matrix.target_name != 'macos'
        working-directory: app
        run: npm run ${{ matrix.npm_script }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-desktop

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Validate mandatory binaries and create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          arm64_dmg=(release-assets/*arm64.dmg)
          x64_dmg=()
          for file in release-assets/*.dmg; do
            [[ "$file" == *arm64.dmg ]] && continue
            x64_dmg+=("$file")
          done
          win_exe=(release-assets/*Setup*.exe)
          linux_appimage=(release-assets/*.AppImage)
          linux_deb=(release-assets/*_amd64.deb)
          win_metadata=(release-assets/stable.yml)
          mac_metadata=(release-assets/stable-mac.yml)
          linux_metadata=(release-assets/stable-linux.yml)

          if [ ${#arm64_dmg[@]} -eq 0 ]; then
            echo "Missing macOS arm64 dmg artifact"
            exit 1
          fi

          if [ ${#x64_dmg[@]} -eq 0 ]; then
            echo "Missing macOS x64 dmg artifact"
            exit 1
          fi

          if [ ${#win_exe[@]} -eq 0 ]; then
            echo "Missing Windows x64 installer artifact"
            exit 1
          fi

          if [ ${#linux_appimage[@]} -eq 0 ]; then
            echo "Missing Linux AppImage x64 artifact"
            exit 1
          fi

          if [ ${#linux_deb[@]} -eq 0 ]; then
            echo "Missing Linux deb x64 artifact"
            exit 1
          fi

          if [ ${#win_metadata[@]} -eq 0 ]; then
            echo "Missing stable.yml metadata"
            exit 1
          fi

          if [ ${#mac_metadata[@]} -eq 0 ]; then
            echo "Missing stable-mac.yml metadata"
            exit 1
          fi

          if [ ${#linux_metadata[@]} -eq 0 ]; then
            echo "Missing stable-linux.yml metadata"
            exit 1
          fi

          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f \( \
            -name '*.dmg' -o \
            -name '*-mac.zip' -o \
            -name '*Setup*.exe' -o \
            -name '*.AppImage' -o \
            -name '*_amd64.deb' -o \
            -name 'stable*.yml' \
          \) -print0 | sort -z)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found to checksum"
            exit 1
          fi

          : > release-assets/sha256sums.txt
          for asset in "${assets[@]}"; do
            hash=$(sha256sum "$asset" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$(basename "$asset")" >> release-assets/sha256sums.txt
          done

          echo "Generated checksums for ${#assets[@]} assets"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/*-mac.zip
            release-assets/*Setup*.exe
            release-assets/*.AppImage
            release-assets/*_amd64.deb
            release-assets/stable*.yml
            release-assets/sha256sums.txt
