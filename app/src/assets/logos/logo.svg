<!-- Standalone Animated Red Metallic Vector SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="auto" style="filter: drop-shadow(0 0 2px rgba(239, 68, 68, 0.1));">
  <defs>
    <linearGradient id="redStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3355" />
      <stop offset="100%" stop-color="#cc001a" />
    </linearGradient>
    <linearGradient id="redFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a4b" />
      <stop offset="100%" stop-color="#66000d" />
    </linearGradient>
  </defs>
  <style>
    .draw-subpath {
      stroke: url(#redStroke);
      stroke-width: 5px;
      fill: url(#redFill);
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: writeEraseLoop 9.5s ease-in-out infinite;
    }
    .path-seq-0 { animation-delay: 0.00s; }
    .path-seq-1 { animation-delay: 0.83s; }
    .path-seq-2 { animation-delay: 1.66s; }
    .path-seq-3 { animation-delay: 2.49s; }

    @keyframes writeEraseLoop {
      0% { stroke-dashoffset: 800; fill-opacity: 0; }
      40% { stroke-dashoffset: 0; fill-opacity: 1; }
      60% { stroke-dashoffset: 0; fill-opacity: 1; }
      90% { stroke-dashoffset: -800; fill-opacity: 0; }
      100% { stroke-dashoffset: -800; fill-opacity: 0; }
    }
  </style>
